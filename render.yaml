# Render Blueprint for the backend (New > Blueprint, point it at this repo).
services:
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false # you type the real keys in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://lyftr-chat.vercel.app
      - key: LLM_MODELS
        sync: false # one LiteLLM model per key, same order as LLM_API_KEYS
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
